description: The electrophysiological data included in Kim et al., Cell Reports 43(4),
  114009 (2024). This dataset contains whole-cell current-clamp recordings (CurrentClampSeries
  and CurrentClampStimulusSeries, NWB format) from ventral pallidal cholinergic projection
  neurons in mice, examining how distinct subpopulations of these neurons encode the
  valence of olfactory (odor) stimuli.
